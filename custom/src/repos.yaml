# Odoo

./odoo:
  defaults:
    # for a sane value of 100 commits)
    depth: 300
  merges:
    - ocb 18.0
    ## XXXvlab: 2024-01-10: Check https://github.com/0k/odoo/commit/fix-ilike-monetary
    ## - 0k fix-ilike-monetary
    ## XXXvlab: 2024-01-16: Check https://github.com/0k/odoo/commit/adv-dbfilter
    ## - 0k adv-dbfilter
  remotes:
    ocb: https://github.com/OCA/OCB.git
    odoo: https://github.com/odoo/odoo.git
  target: ocb 18.0

./design-theme:
  defaults:
    depth: $DEPTH_DEFAULT
  merges:
    - origin 18.0
  remotes:
    origin: https://github.com/odoo/design-themes.git
  target: origin 18.0

