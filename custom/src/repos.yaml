# See https://github.com/Tecnativa/doodba#optodoocustomsrcreposyaml
# Cloudron Odoo 18.0 — fork arpol-dev/cloudron-odoo
# Generé depuis la liste v14 Alusage, en conservant tous les repos ayant une branche 18.0.
# Repos absents de la v18 OCA (pas de branche 18.0) :
#   formio (novacode-nl), muk-web (muk-it), project-tools (elabore-coop),
#   pad-tools (elabore-coop), sync-addons (itpp-labs)
# Repos privés Myceliandre non inclus dans cette image générique :
#   odoo-theme, vertical-cooperative, galicea-addons, straga-main

