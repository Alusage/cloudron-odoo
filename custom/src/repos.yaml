# Depots agreges dans /app/code/custom/src par git-aggregator.
# Le coeur d'Odoo n'est PAS agrege ici : il est clone une seule fois depuis
# OCA/OCB vers /app/code/odoo par le Dockerfile.

./design-theme:
  defaults:
    depth: $DEPTH_DEFAULT
  merges:
    - origin 18.0
  remotes:
    origin: https://github.com/odoo/design-themes.git
  target: origin 18.0

